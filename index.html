<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Word Counter V3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

<div class="container py-5">
  <h1 class="mb-4 text-center">Text Word Counter V3</h1>

  <div class="mb-3">
    <textarea id="textInput" class="form-control" rows="8" placeholder="متن خود را اینجا وارد کنید..."></textarea>
  </div>

  <div class="d-flex justify-content-between mb-3">
    <button id="countBtn" class="btn btn-primary">شمارش</button>
    <button id="copyBtn" class="btn btn-success">کپی نتایج</button>
    <button id="toggleThemeBtn" class="btn btn-secondary">تغییر تم</button>
  </div>

  <div id="results" class="border p-3 bg-white rounded">
    <p>تعداد کاراکترها: <span id="charCount">0</span></p>
    <p>تعداد کاراکترها (بدون فاصله): <span id="charNoSpace">0</span></p>
    <p>تعداد کلمات: <span id="wordCount">0</span></p>
    <p>تعداد جملات: <span id="sentenceCount">0</span></p>
    <p>تعداد پاراگراف: <span id="paragraphCount">0</span></p>
    <p>کلمات تکراری: <span id="duplicateWords">هیچ</span></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
